    <meta name="theme-color" content="#0f172a">
    <script>
        // Tema ve özel renk paleti (titremeyi önlemek için en başta çalışır)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) {
                d.classList.add('light-mode');
            }
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                    // Buton zeminleri de zemine göre okunabilir kalsın
                    d.style.setProperty('--btn-bg', bgIsLight ? 'rgba(15,23,42,0.06)' : 'rgba(248,250,252,0.10)');
                    d.style.setProperty('--btn-hover', bgIsLight ? 'rgba(15,23,42,0.12)' : 'rgba(248,250,252,0.18)');
                }
            }
            // Safari/Chrome üst-alt çubuğu sayfa zeminine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f1f5f9' : '#0f172a'));

            // Dil ve yön
            const currentLang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', currentLang);
            d.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>

        @media(max-width: 480px) { .times-grid { grid-template-columns: repeat(2, 1fr); } }

            table_title: "📅 إمساكية الشهر",
            th_day: "اليوم", th_date: "التاريخ", th_imsak: "الإمساك", th_gunes: "الشروق", th_ogle: "الظهر", th_ikindi: "العصر", th_aksam: "المغرب", th_yatsi: "العشاء",
            footer_slogan: "دليلك للسلام والعبادة",
            hero_before_title: "الوقت المتبقي لرمضان", hero_before_sub: "الشهر المبارك المنتظر",
            hero_during_title: "سلطان الشهور", hero_during_sub: "موسم البركة والعبادة والمغفرة",
            start_prefix: "بداية رمضان: ", estimate_tag: " (تقديري)",
            before_label: "الوقت المتبقي لأول صيام (الإمساك)", before_target: "اقترب الشهر المبارك",
            until_iftar: "الوقت المتبقي للإفطار", iftar_target: "حتى أذان المغرب (الإفطار)",
            until_imsak: "الوقت المتبقي للإمساك", sahur_target: "حتى الإمساك (نهاية السحور)",
            done_msg: "انتهى شهر رمضان. عيدكم مبارك! 🌙",
            status_loading: "جاري تحميل الإمساكية...", status_error: "تعذر تحميل الإمساكية، جارٍ إعادة المحاولة...",
            table_note: "تُحسب الأوقات بطريقة الديانة التركية، وقد تختلف عن الإمساكية الرسمية بما يصل إلى دقيقة.",
            estimate_note: "تاريخ هذا الشهر تقديري، وسيتأكد عند نشر تقويم الديانة. "
        }
    };
    const lang = translations[localStorage.getItem('user_lang')] ? localStorage.getItem('user_lang') : 'tr';
    const L = translations[lang];
    const intlLoc = { tr: 'tr-TR', en: 'en-US', ar: 'ar-u-ca-gregory-nu-latn' }[lang];

    // <PURE>
    // ===================== ZAMAN YARDIMCILARI (Türkiye = UTC+3 sabit) =====================
    const TR_OFFSET_MS = 3 * 3600 * 1000;
    function pad2(n) { return String(n).padStart(2, '0'); }
    function trYMD(ms) { const d = new Date(ms + TR_OFFSET_MS); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }
    function ymdStr(o) { return `${o.y}-${pad2(o.m)}-${pad2(o.d)}`; }
    function parseYMD(s) { const a = s.split('-').map(Number); return { y: a[0], m: a[1], d: a[2] }; }
    function addDays(o, n) { const d = new Date(Date.UTC(o.y, o.m - 1, o.d) + n * 86400000); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }
    function toEpoch(o, hhmm) {
        const m = String(hhmm).match(/(\d{1,2}):(\d{2})/);
        if (!m) return NaN;
        return Date.UTC(o.y, o.m - 1, o.d, parseInt(m[1], 10), parseInt(m[2], 10), 0) - TR_OFFSET_MS;
    }
    function toAscii(s) {
        const map = { 'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U' };
        return String(s).replace(/[çğıöşüÇĞİÖŞÜ]/g, ch => map[ch]);
    }
    function normCity(str) {
        return String(str || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9]/g, '');
    }
    function periodEnd(p) { return addDays(parseYMD(p.start), p.days - 1); }
    function pickPeriod(todayStr) {
        for (const p of RAMADAN) if (todayStr <= ymdStr(periodEnd(p))) return p;
        return null;
    }
    // Dönemi kapsayan (bir gün öncesi ve sonrası dahil) ay listesi
    function monthsFor(p) {
        const first = addDays(parseYMD(p.start), -1), last = addDays(periodEnd(p), 1), out = [];
        let y = first.y, m = first.m;
        while (y < last.y || (y === last.y && m <= last.m)) { out.push({ y, m }); m++; if (m > 12) { m = 1; y++; } }
        return out;
    }
    // </PURE>

    const KEYS = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    function tuneSig() { return [TUNE.fajr, TUNE.sunrise, TUNE.dhuhr, TUNE.asr, TUNE.maghrib, TUNE.isha].join(','); }
    function tuneQuery() {
        if (tuneSig() === '0,0,0,0,0,0') return '';
        return `&tune=0,${TUNE.fajr},${TUNE.sunrise},${TUNE.dhuhr},${TUNE.asr},${TUNE.maghrib},0,${TUNE.isha},0`;
    }

    // ===================== DURUM =====================
    const state = { cityName: 'İstanbul', apiCity: 'Istanbul', period: null, data: null, loading: false, seq: 0, retryMs: 3000, retryTimer: null, renderedKey: '' };

    // ===================== VERİ (önbellekli) =====================
    async function getMonth(apiCity, y, m) {
        const key = `rm2_${apiCity}_${y}-${pad2(m)}_${tuneSig()}`;
        try {
            const cached = JSON.parse(localStorage.getItem(key) || 'null');
            if (cached && typeof cached === 'object' && Object.keys(cached).length >= 28) return cached;
        } catch (e) { /* önbellek bozuksa ağdan al */ }

        const url = `https://api.aladhan.com/v1/calendarByCity/${y}/${m}?city=${encodeURIComponent(apiCity)}&country=Turkey&method=13${tuneQuery()}`;
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 15000);
        let json;
        try {
            const res = await fetch(url, { signal: ctrl.signal });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            json = await res.json();
        } finally { clearTimeout(to); }

        if (!json || !Array.isArray(json.data)) throw new Error('Geçersiz veri');
        const out = {};
        json.data.forEach(item => {
            const ds = item && item.date && item.date.gregorian && item.date.gregorian.date;   // "08-02-2027"
            const parts = String(ds || '').split('-');
            if (parts.length !== 3) return;
            const t = {};
            for (const k of KEYS) {
                const mm = String(item.timings[k] || '').match(/(\d{1,2}):(\d{2})/);
                if (!mm) return;
                t[k] = `${pad2(parseInt(mm[1], 10))}:${mm[2]}`;
            }
            out[`${parts[2]}-${parts[1]}-${parts[0]}`] = t;
        });
        if (Object.keys(out).length < 28) throw new Error('Eksik ay verisi');
        try { localStorage.setItem(key, JSON.stringify(out)); } catch (e) { /* kota */ }
        return out;
    }

    async function loadData() {
        const p = state.period;
        if (!p || state.loading) return;
        state.loading = true;
        const mySeq = ++state.seq;
        clearTimeout(state.retryTimer);
        setStatus(L.status_loading, true);
        try {
            const merged = {};
            for (const mo of monthsFor(p)) Object.assign(merged, await getMonth(state.apiCity, mo.y, mo.m));
            if (mySeq !== state.seq) return;
            state.data = merged; state.retryMs = 3000; state.renderedKey = '';
            setStatus('', false);
            renderAll();
        } catch (err) {
            if (mySeq !== state.seq) return;
            console.error('İmsakiye alınamadı:', err);
            setStatus(L.status_error, true);
            state.retryTimer = setTimeout(() => { state.loading = false; loadData(); }, state.retryMs);
            state.retryMs = Math.min(state.retryMs * 2, 60000);
            return;
        } finally {
            if (mySeq === state.seq) { /* hata yolunda loading bir sonraki denemede açılır */ }
        }
        state.loading = false;
    }

    function setStatus(text, show) {
        const el = document.getElementById('table-status');
        el.textContent = text; el.style.display = show ? 'block' : 'none';
    }

    // ===================== EKRAN =====================
    function fmtDate(o, opts) {
        return new Intl.DateTimeFormat(intlLoc, Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(Date.UTC(o.y, o.m - 1, o.d, 12)));
    }

    function renderAll() {
        const p = state.period;
        if (!p) return;
        const todayStr = ymdStr(trYMD(Date.now()));
        const before = todayStr < p.start;
        const key = `${p.start}|${before}|${todayStr}|${state.data ? 1 : 0}`;
        if (key === state.renderedKey) return;
        state.renderedKey = key;

        // Hero
        document.getElementById('hero-badge-text').textContent = `${p.hijri}`;
        document.getElementById('hero-main-title').textContent = before ? L.hero_before_title : L.hero_during_title;
        document.getElementById('hero-sub-title').textContent = before ? L.hero_before_sub : L.hero_during_sub;
        document.getElementById('hero-date').textContent = L.start_prefix + fmtDate(parseYMD(p.start), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + (p.estimate ? L.estimate_tag : '');
        document.getElementById('box-days').style.display = before ? 'flex' : 'none';
        document.getElementById('vakitler-grid').style.display = (!before && state.data) ? 'grid' : 'none';

        // Not
        document.getElementById('table-note').textContent = (p.estimate ? L.estimate_note : '') + L.table_note;

        // Bugünün vakitleri
        if (!before && state.data && state.data[todayStr]) {
            const t = state.data[todayStr];
            document.getElementById('vakit-imsak').textContent = t.Fajr;
            document.getElementById('vakit-gunes').textContent = t.Sunrise;
            document.getElementById('vakit-ogle').textContent = t.Dhuhr;
            document.getElementById('vakit-ikindi').textContent = t.Asr;
            document.getElementById('vakit-aksam').textContent = t.Maghrib;
            document.getElementById('vakit-yatsi').textContent = t.Isha;
        }

        // Tablo (kesin tarihli dönemlerde; tahmini dönemde de gösterilir, not düşülür)
        const tbody = document.getElementById('imsakiye-tbody');
        const wrap = document.getElementById('table-wrapper');
        if (!state.data) { wrap.style.display = 'none'; return; }
        let html = '';
        for (let i = 0; i < p.days; i++) {
            const day = addDays(parseYMD(p.start), i), ds = ymdStr(day), t = state.data[ds] || {};
            html += `<tr class="${ds === todayStr ? 'today-row' : ''}"><td>${i + 1}</td><td class="c-date">${fmtDate(day, { day: 'numeric', month: 'long' })}</td>` +
                KEYS.map(k => `<td>${t[k] || '--:--'}</td>`).join('') + '</tr>';
        }
        tbody.innerHTML = html;
        wrap.style.display = 'block';
        const row = tbody.querySelector('.today-row');
        if (row) wrap.scrollTop = Math.max(0, row.offsetTop - 70);
    }

    function setTimer(sec) {
        sec = Math.max(0, Math.floor(sec));
        document.getElementById('days').textContent = pad2(Math.floor(sec / 86400));
        document.getElementById('hours').textContent = pad2(Math.floor((sec % 86400) / 3600));
        document.getElementById('minutes').textContent = pad2(Math.floor((sec % 3600) / 60));
        document.getElementById('seconds').textContent = pad2(sec % 60);
    }

    function tick() {
        const now = Date.now();
        const todayStr = ymdStr(trYMD(now));
        const period = pickPeriod(todayStr);

        if (period !== state.period) {                 // dönem değişti (ör. Ramazan bitti, sıradaki yıl)
            state.period = period; state.data = null; state.renderedKey = ''; state.loading = false; state.seq++;
            document.getElementById('imsakiye-tbody').innerHTML = '';
            document.getElementById('table-wrapper').style.display = 'none';
            if (period) loadData();
        }
        if (!period) return;
        renderAll();

        const before = todayStr < period.start;
        const labelEl = document.getElementById('countdown-label'), targetEl = document.getElementById('countdown-target-text');
        const grid = document.getElementById('timer-grid'), done = document.getElementById('done-msg');
        done.style.display = 'none'; grid.style.display = 'grid';

        if (before) {
            const startDay = parseYMD(period.start);
            const first = state.data && state.data[period.start];
            const target = first ? toEpoch(startDay, first.Fajr) : toEpoch(startDay, '00:00');
            labelEl.textContent = L.before_label; targetEl.textContent = L.before_target;
            setTimer((target - now) / 1000);
            return;
        }

        if (!state.data) { labelEl.textContent = L.until_iftar; targetEl.textContent = L.status_loading; setTimer(0); return; }

        const endStr = ymdStr(periodEnd(period));
        const today = trYMD(now), events = [];
        for (const off of [-1, 0, 1]) {
            const day = addDays(today, off), ds = ymdStr(day), t = state.data[ds];
            if (!t) continue;
            events.push({ type: 'imsak', t: toEpoch(day, t.Fajr), day: ds });
            events.push({ type: 'iftar', t: toEpoch(day, t.Maghrib), day: ds });
        }
        events.sort((a, b) => a.t - b.t);
        const next = events.find(e => e.t > now);

        if (!next || (next.type === 'imsak' && next.day > endStr)) {
            grid.style.display = 'none'; done.style.display = 'block'; done.textContent = L.done_msg;
            labelEl.textContent = ''; targetEl.textContent = '';
            return;
        }
        labelEl.textContent = next.type === 'iftar' ? L.until_iftar : L.until_imsak;
        targetEl.textContent = next.type === 'iftar' ? L.iftar_target : L.sahur_target;
        setTimer((next.t - now) / 1000);
    }

    // ===================== ŞEHİR =====================
    function populateCitySelector() {
        const select = document.getElementById('city-selector');
        select.innerHTML = '';
        turkiyeIlleri.slice().sort((a, b) => a.localeCompare(b, 'tr')).forEach(city => {
            const opt = document.createElement('option');
            opt.value = city; opt.textContent = city;
            select.appendChild(opt);
        });
        // DÜZELTME: Diğer sayfalarla ortak "user_city" kullanılır; eski "selected_city" yedek olarak okunur
        const saved = localStorage.getItem('user_city') || localStorage.getItem('selected_city') || 'İstanbul';
        const want = normCity(saved);
        const match = turkiyeIlleri.find(c => normCity(c) === want) || 'İstanbul';
        select.value = match;
        applyCity(match, false);
    }

    function applyCity(name, reload) {
        state.cityName = name; state.apiCity = toAscii(name);
        document.getElementById('selected-city-name').textContent = name;
        if (reload) {
            state.data = null; state.renderedKey = ''; state.loading = false; state.seq++;
            document.getElementById('table-wrapper').style.display = 'none';
            document.getElementById('vakitler-grid').style.display = 'none';
            loadData();
        }
    }

    function changeCity(name) {
        localStorage.setItem('user_city', name);
        localStorage.setItem('selected_city', name);
        applyCity(name, true);
    }

    // ===================== TEMA =====================
    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }
    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

    // ===================== BAŞLATMA =====================
    window.addEventListener('load', () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const k = el.getAttribute('data-i18n');
            if (L[k]) { if (el.tagName === 'TITLE') document.title = L[k]; else el.textContent = L[k]; }
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const k = el.getAttribute('data-i18n-title');
            if (L[k]) { el.title = L[k]; el.setAttribute('aria-label', L[k]); }
        });
        document.title = L.page_title;
        updateThemeButton();
        updateThemeColor();
        populateCitySelector();
        tick();
        setInterval(tick, 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
        window.addEventListener('online', () => { if (state.period && !state.data) { state.loading = false; loadData(); } });
    });
</script>
